name: Sync to Standalone Repository

# Mirrors the fork into Heretek-AI/Heretek-ProxmoxVE, keeping only the
# Heretek scripts. This fork carries upstream's full app catalog; the
# standalone repo only carries the ct/ scripts that load misc/ from this
# fork (they default COMMUNITY_SCRIPTS_URL to Heretek-AI/ProxmoxVE).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork repository
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Checkout standalone repository
        uses: actions/checkout@v4
        with:
          repository: Heretek-AI/Heretek-ProxmoxVE
          token: ${{ secrets.PAT_STANDALONE }}
          path: standalone
          fetch-depth: 0

      - name: Sync shared code and Heretek scripts
        run: |
          # Shared code, docs and frontend. The standalone repo keeps its own
          # README.md and .github/, and ct/ and install/ are handled below.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            --exclude='/ct/' \
            --exclude='/install/' \
            fork/ standalone/

          # Heretek scripts only
          rm -rf standalone/ct standalone/install
          mkdir -p standalone/ct/headers standalone/install
          for script in fork/ct/*.sh; do
            grep -q 'COMMUNITY_SCRIPTS_URL:-https://raw.githubusercontent.com/Heretek-AI/' "$script" || continue
            app="$(basename "$script" .sh)"
            cp "$script" standalone/ct/
            [[ -f "fork/ct/headers/${app}" ]] && cp "fork/ct/headers/${app}" standalone/ct/headers/
            [[ -f "fork/install/${app}-install.sh" ]] && cp "fork/install/${app}-install.sh" standalone/install/
          done

          echo "Synced scripts:"
          ls standalone/ct

      - name: Commit and push to standalone
        run: |
          cd standalone
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
          else
            git add -A
            git commit -m "Sync from Heretek-AI/ProxmoxVE - $(date +%Y-%m-%d)"
            git push
            echo "Changes pushed to standalone repository"
          fi
