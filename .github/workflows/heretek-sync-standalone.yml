name: Sync to Standalone Repository

# Mirrors the Heretek scripts into Heretek-AI/Heretek-ProxmoxVE. This fork
# carries upstream's full app catalog; the standalone repo carries only the
# scripts that default COMMUNITY_SCRIPTS_URL to Heretek-AI/ProxmoxVE.

on:
  push:
    branches:
      - main
    paths:
      - "ct/**"
      - "install/**"
      - ".github/workflows/heretek-sync-standalone.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'Heretek-AI/ProxmoxVE'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork repository
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Checkout standalone repository
        uses: actions/checkout@v4
        with:
          repository: Heretek-AI/Heretek-ProxmoxVE
          token: ${{ secrets.PAT_STANDALONE }}
          path: standalone
          fetch-depth: 0

      - name: Sync Heretek scripts
        run: |
          # The standalone repo carries only the Heretek scripts plus its own
          # README.md and .github/. The scripts load the engine from
          # community-scripts/core and their install scripts from this fork.
          find standalone -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name .github ! -name README.md \
            -exec rm -rf {} +
          cp fork/LICENSE standalone/
          mkdir -p standalone/ct standalone/install
          for script in fork/ct/*.sh; do
            grep -q 'COMMUNITY_SCRIPTS_URL:-https://raw.githubusercontent.com/Heretek-AI/' "$script" || continue
            app="$(basename "$script" .sh)"
            cp "$script" standalone/ct/
            [[ -f "fork/install/${app}-install.sh" ]] && cp "fork/install/${app}-install.sh" standalone/install/
          done

          echo "Synced scripts:"
          ls standalone/ct

      - name: Commit and push to standalone
        run: |
          cd standalone
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
          else
            git add -A
            git commit -m "Sync from Heretek-AI/ProxmoxVE - $(date +%Y-%m-%d)"
            git push
            echo "Changes pushed to standalone repository"
          fi
