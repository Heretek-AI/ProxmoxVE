name: Sync upstream

# Merges community-scripts/ProxmoxVE main into a branch and opens a pull
# request. Heretek changes live only in files upstream doesn't have (see
# docs/FORK.md), so the merge is normally conflict-free. If it isn't, an
# issue lists the conflicting files instead.
#
# Needs the PAT_WORKFLOW secret: a fine-grained token for this repository
# with Contents, Pull requests, Issues and Workflows set to read and write.
# GITHUB_TOKEN can't push upstream's workflow changes, and pull requests it
# opens don't trigger CI.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync

env:
  UPSTREAM: community-scripts/ProxmoxVE
  SYNC_BRANCH: upstream-sync

jobs:
  sync:
    if: github.repository == 'Heretek-AI/ProxmoxVE'
    runs-on: ubuntu-latest
    steps:
      - name: Check token
        env:
          PAT_WORKFLOW: ${{ secrets.PAT_WORKFLOW }}
        run: |
          if [ -z "$PAT_WORKFLOW" ]; then
            echo "::error::The PAT_WORKFLOW secret is not set. See docs/FORK.md."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT_WORKFLOW }}

      - name: Merge upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            echo "result=up-to-date" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout -B "$SYNC_BRANCH"
          if git merge --no-edit -m "Merge $UPSTREAM main" upstream/main; then
            echo "result=merged" >> "$GITHUB_OUTPUT"
            echo "commits=$(git rev-list --count main..upstream/main)" >> "$GITHUB_OUTPUT"
          else
            {
              echo "conflicts<<EOF"
              git diff --name-only --diff-filter=U
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the sync pull request
        if: steps.merge.outputs.result == 'merged'
        env:
          GH_TOKEN: ${{ secrets.PAT_WORKFLOW }}
          COMMITS: ${{ steps.merge.outputs.commits }}
        run: |
          git push --force origin "$SYNC_BRANCH"
          if [ -z "$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[].number')" ]; then
            body="$(printf 'Merges %s new commits from [%s](https://github.com/%s). Created by heretek-upstream-sync.yml; it updates this pull request on each run until it is merged.\n\nMerge with **Create a merge commit**. Squashing drops upstream history and makes the next sync conflict.' "$COMMITS" "$UPSTREAM" "$UPSTREAM")"
            gh pr create --base main --head "$SYNC_BRANCH" \
              --title "Sync with $UPSTREAM" --body "$body"
          fi

      - name: Report conflicts
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.PAT_WORKFLOW }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          title="Upstream sync has merge conflicts"
          body="$(printf 'Merging %s main into main conflicts in:\n\n```\n%s\n```\n\nA Heretek change has touched an upstream-owned file. Merge upstream by hand and move the Heretek change into a Heretek-owned file (see docs/FORK.md).' "$UPSTREAM" "$CONFLICTS")"
          existing="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
          exit 1
